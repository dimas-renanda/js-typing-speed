<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Typing Speed Test</title>
<style>
  body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#1d4ed8,#6d28d9,#0ea5e9);background-size:300% 300%;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{max-width:760px;width:90%;text-align:center;padding:2rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 25px 60px rgba(0,0,0,.35)}
  h1{margin-bottom:.5rem;font-size:2.2rem;font-weight:800;letter-spacing:.5px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  #quote{margin:1.8rem 0;padding:1.6rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;font-size:1.15rem;line-height:2;text-align:left;color:#f8fafc}
  .correct{color:#4ade80}
  .wrong{color:#fb7185}
  .current{border-bottom:2px solid #facc15}
  textarea{width:100%;height:90px;padding:1rem;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:14px;font-size:1rem;resize:none;outline:none;box-sizing:border-box}
  .stats{display:flex;justify-content:center;gap:2rem;margin:1.5rem 0;font-size:1rem}
  .stat span{display:block;font-size:1.9rem;font-weight:800;color:#7dd3fc;margin-bottom:.2rem}
  button{padding:.9rem 2.4rem;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(59,130,246,.35)}
</style>
</head>
<body>
<div class="card">
  <h1>⌨️ Typing Speed Test</h1>
  <div id="quote"></div>
  <textarea id="input" placeholder="Start typing to begin..." oninput="check()"></textarea>
  <div class="stats">
    <div class="stat"><span id="wpm">0</span>WPM</div>
    <div class="stat"><span id="acc">100</span>% ACC</div>
    <div class="stat"><span id="time">0</span>s</div>
  </div>
  <button onclick="restart()">New Quote</button>
</div>
<script>
const quotes=["The quick brown fox jumps over the lazy dog","Programming is the art of telling another human what one wants the computer to do","Any sufficiently advanced technology is indistinguishable from magic","First solve the problem then write the code","Code is like humor when you have to explain it it is bad"];
let current=[],start=null,timer=null;
function restart(){
  const q=quotes[Math.floor(Math.random()*quotes.length)];
  current=q.split('');
  document.getElementById('input').value='';
  document.getElementById('wpm').textContent='0';
  document.getElementById('acc').textContent='100';
  document.getElementById('time').textContent='0';
  clearInterval(timer);start=null;
  render([]);
  document.getElementById('input').focus();
}
function render(typed){
  document.getElementById('quote').innerHTML=current.map((c,i)=>{
    let cls='';
    if(i<typed.length)cls=typed[i]===c?'correct':'wrong';
    else if(i===typed.length)cls='current';
    return`<span class="${cls}">${c==' '?'&nbsp;':c}</span>`;
  }).join('');
}
function check(){
  const inp=document.getElementById('input').value;
  if(inp.length===1&&!start){start=Date.now();timer=setInterval(tick,200)}
  const typed=inp.split('');
  render(typed);
  const correct=typed.filter((c,i)=>c===current[i]).length;
  const acc=typed.length?Math.round(correct/typed.length*100):100;
  document.getElementById('acc').textContent=acc;
  if(typed.length===current.length){
    clearInterval(timer);
    const elapsed=(Date.now()-start)/1000;
    const wpm=Math.round((current.length/5)/(elapsed/60));
    document.getElementById('wpm').textContent=wpm;
  }
}
function tick(){if(start)document.getElementById('time').textContent=((Date.now()-start)/1000).toFixed(1)}
restart();
</script>
</body></html>
